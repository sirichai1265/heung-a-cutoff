name: Refresh schedule

# Pulls the next 2 months of THBKK / THLCH departures from ebiz.heungaline.com
# and republishes the dashboard.
#   Main runs   00:00 / 06:00 / 11:00 UTC = 07:00 / 13:00 / 18:00 Bangkok
#   Backup runs 01:00 / 05:00 / 10:00 UTC = 08:00 / 12:00 / 17:00 Bangkok
# GitHub often starts scheduled jobs late or drops them, so each backup run only does
# the work if no automatic refresh happened in the previous 4 hours.
on:
  schedule:
    - cron: "0 0,6,11 * * *"
    - cron: "0 1,5,10 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-schedule
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 30

      - name: Skip backup run if a refresh just happened
        id: gate
        run: |
          last=$(git log -1 --author=github-actions --format=%ct || true)
          age=$(( $(date +%s) - ${last:-0} ))
          if [ "${{ github.event.schedule }}" = "0 1,5,10 * * *" ] && [ "$age" -lt 14400 ]; then
            echo "Last automatic refresh was ${age}s ago - backup run not needed."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.gate.outputs.skip != 'true'
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: steps.gate.outputs.skip != 'true'
        run: pip install xlrd openpyxl

      - name: Build dashboard from the web schedule
        if: steps.gate.outputs.skip != 'true'
        run: python build_dashboard.py --web

      - name: Save a dated Excel snapshot
        if: steps.gate.outputs.skip != 'true'
        run: python export_excel.py

      - name: Commit and publish if anything changed
        if: steps.gate.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet && [ -z "$(git status --porcelain daily)" ]; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- index.html "Cut off - Open Gate Dashboard.html" daily
          git commit -m "Auto-refresh schedule from ebiz.heungaline.com ($(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M') Bangkok)"
          git push
          # pushes made with GITHUB_TOKEN do not start the Pages build on their own
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
